# =====================================================================
#  테스트 전용 설정 (@ActiveProfiles("test"))
#
#  이 파일 하나로 컨텍스트가 뜨도록 필요한 값을 모두 채워둔다.
#  main 의 application.yml 은 .gitignore 대상이라 팀원·CI 환경에는
#  없을 수 있으므로, 테스트가 그 파일에 의존해서는 안 된다.
#
#  ⚠ 여기의 모든 키·시크릿은 테스트용 더미다. 실제 값을 넣지 말 것.
# =====================================================================
spring:
  datasource:
    # MODE=MySQL: calls 같은 예약어 처리와 함수 동작을 MySQL 에 맞춘다.
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      # 테스트에서는 엔티티로부터 스키마를 만든다.
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false

  sql:
    init:
      # schema.sql / data.sql 은 MySQL 전용 문법(ENGINE, COMMENT 등)이라
      # H2 에서 실행하면 실패한다. 테스트에서는 사용하지 않는다.
      mode: never

privacy:
  retention:
    call-record-days: 90
    access-log-days: 730
    # 테스트 중 배치가 돌지 않도록 2월 31일(존재하지 않는 날짜)로 둔다.
    purge-cron: "0 0 0 31 2 *"

# ---------------------------------------------------------------------
