plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.0'
    id 'io.spring.dependency-management' version '1.1.5'
    id 'com.google.protobuf' version '0.9.4'
}

group = 'dgdr'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '17'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-reactor-netty'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'javazoom:jlayer:1.0.1'

    runtimeOnly 'com.mysql:mysql-connector-j'
    // H2 는 테스트 전용 (운영/개발 기동은 docker-compose 의 MySQL 사용)
    testRuntimeOnly 'com.h2database:h2'

    implementation 'software.amazon.awssdk:sagemakerruntime:2.25.70'
    implementation 'org.apache.commons:commons-text:1.11.0'

    implementation 'com.vonage:server-sdk:8.7.0'
    implementation 'com.vonage:jwt:2.0.0'

    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation group: 'com.microsoft.cognitiveservices.speech', name: 'client-sdk', version: "1.37.0", ext: "jar"

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    implementation 'io.jsonwebtoken:jjwt-impl:0.11.5'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    implementation 'io.grpc:grpc-netty-shaded:1.62.2'
    implementation 'io.grpc:grpc-protobuf:1.62.2'
    implementation 'io.grpc:grpc-stub:1.62.2'
    implementation 'com.google.protobuf:protobuf-java:3.25.3'
    compileOnly 'org.apache.tomcat:annotations-api:6.0.53'
}

protobuf {
    protoc { artifact = 'com.google.protobuf:protoc:3.25.3' }
    plugins {
        grpc { artifact = 'io.grpc:protoc-gen-grpc-java:1.62.2' }
    }
    generateProtoTasks {
        all().each { task -> task.plugins { grpc {} } }
    }
}

// ---------------------------------------------------------------------
// 소스 인코딩을 UTF-8 로 고정한다.
//
// javac 는 지정이 없으면 플랫폼 기본 인코딩을 쓴다. 윈도우 한국어 환경에서는
// 그것이 MS949(CP949)이므로, UTF-8 로 저장된 한글 문자열 리터럴과 주석이
// 컴파일 시점에 깨진다. 같은 소스가 개발자 OS 에 따라 다른 바이너리를
// 만들어내는 셈이라, 이 프로젝트처럼 한글 리터럴(매뉴얼 본문, 시나리오 대본,
// 화자 라벨)이 도메인 데이터인 경우에는 반드시 고정해야 한다.
// ---------------------------------------------------------------------
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}
tasks.withType(Test).configureEach {
    systemProperty 'file.encoding', 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
}